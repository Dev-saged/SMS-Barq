# Builds the Barq APK on GitHub — no computer needed.
# - Every push builds an APK (Actions tab → run → Artifacts) and refreshes the "latest-build" release
#   (the in-app update check reads it).
# - Every version (VERSION_NAME in gradle.properties) gets its own release "v1.5.0" with
#   Barq-v1.5.0.apk and Arabic notes from docs/releases/v1.5.0.md. Building the same version again
#   replaces its APK. Older versions stay listed, so anyone can go back.
# - Run manually (Actions → Build Barq APK → Run workflow) with "Publish older versions" ticked to
#   turn the APKs of earlier builds still kept by GitHub (90 days) into releases too.
# - Uploading the project as a single .zip from a phone also works: this workflow unpacks it first.
name: Build Barq APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Publish older versions as releases (from saved builds)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.backfill
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack uploaded project zip (phone helper)
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then echo "No project zip to unpack."; exit 0; fi
          ZIP="${zips[0]}"
          echo "Unpacking $ZIP"
          rm -rf /tmp/unz && mkdir -p /tmp/unz
          unzip -q -o "$ZIP" -d /tmp/unz
          SETTINGS=$(find /tmp/unz -maxdepth 3 -name settings.gradle.kts | head -n1)
          if [ -z "$SETTINGS" ]; then echo "::error::The zip does not contain settings.gradle.kts"; exit 1; fi
          SRC=$(dirname "$SETTINGS")
          # Workflow files cannot be committed by the bot; the one you created stays in place.
          (cd "$SRC" && tar --exclude='./.github' -cf - .) | tar -xmf -
          git rm -q "$ZIP"
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Unpack $ZIP" && git push origin "HEAD:$GITHUB_REF_NAME" || echo "Nothing to commit"
          fi

      - name: Check project is present
        id: check
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Project files not uploaded yet — upload Barq-project.zip and the build will start."
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.check.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        if: steps.check.outputs.ready == 'true' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/barq-release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/barq-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.check.outputs.ready == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        if: steps.check.outputs.ready == 'true'
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Barq-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/*.apk "dist/Barq-latest.apk"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set — APK is signed with a temporary key. Add the secrets (see docs/PUBLISHING.md) so updates install over each other."
          fi
          ls -l dist

      - name: Upload APK artifact
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Barq-APK-${{ github.run_number }}
          path: dist/Barq-v*.apk
          if-no-files-found: error

      - name: Update "latest-build" release
        if: steps.check.outputs.ready == 'true' && github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Barq — آخر نسخة تجريبية
          body: آخر APK تم بناؤه تلقائياً من الفرع ${{ github.ref_name }} (build ${{ github.run_number }}).
          prerelease: true
          files: dist/Barq-latest.apk

      - name: Publish this version as its own release
        if: steps.check.outputs.ready == 'true' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          TAG="v$VERSION"
          cp dist/Barq-latest.apk "dist/Barq-$TAG.apk"
          NOTES="docs/releases/$TAG.md"
          if [ ! -f "$NOTES" ]; then echo "## برق $VERSION" > /tmp/notes.md; NOTES=/tmp/notes.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/Barq-$TAG.apk" --clobber
            gh release edit "$TAG" --title "برق $VERSION" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "dist/Barq-$TAG.apk" --title "برق $VERSION" --notes-file "$NOTES" --target "$(git rev-parse HEAD)" --latest
          fi
          # version.json: lets the app learn the newest version and build code without GitHub's API.
          BASE=$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2)
          jq -n --arg v "$VERSION" --argjson c "$((BASE + GITHUB_RUN_NUMBER))" --arg apk "Barq-$TAG.apk" --rawfile n "$NOTES" \
            '{version:$v,code:$c,apk:$apk,notes:$n}' > dist/version.json
          gh release upload "$TAG" dist/version.json --clobber

      - name: Upload database schema
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Barq-schemas-${{ github.run_number }}
          path: app/schemas
          if-no-files-found: ignore

      - name: Unit tests
        if: steps.check.outputs.ready == 'true'
        id: tests
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Report failed tests
        if: steps.check.outputs.ready == 'true' && steps.tests.outcome == 'failure'
        run: echo "::warning::Some unit tests failed (the APK was still published). Open the 'Unit tests' step to see which."

      - name: Lint
        if: steps.check.outputs.ready == 'true'
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Upload lint report
        if: steps.check.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: Barq-lint-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # One-time helper: earlier builds' APKs (kept by GitHub for 90 days) become releases v1.0.0, v1.1.0…
  backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.backfill
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish older versions from saved builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/old && cd /tmp/old
          gh api "repos/$GH_REPO/actions/artifacts?per_page=100" --paginate \
            -q '.artifacts[] | select(.name | startswith("Barq-APK-")) | select(.expired | not) | "\(.id) \(.workflow_run.head_sha)"' > list.txt
          echo "Saved builds found: $(wc -l < list.txt)"
          while read -r ID SHA; do
            gh api "repos/$GH_REPO/actions/artifacts/$ID/zip" > a.zip 2>/dev/null || continue
            rm -rf x && mkdir x && unzip -q -o a.zip -d x || continue
            for f in x/Barq-v*-build*.apk; do
              [ -f "$f" ] || continue
              n=$(basename "$f"); VER=${n#Barq-v}; VER=${VER%%-build*}; B=${n##*-build}; B=${B%.apk}
              # Keep the newest build of each version.
              if [ ! -f "best-$VER" ] || [ "$B" -gt "$(cat "best-$VER")" ]; then
                echo "$B" > "best-$VER"; cp "$f" "Barq-v$VER.apk"; echo "$SHA" > "sha-$VER"
              fi
            done
          done < list.txt
          cd "$GITHUB_WORKSPACE"
          for apk in /tmp/old/Barq-v*.apk; do
            [ -f "$apk" ] || { echo "No saved APKs left (older than 90 days?)"; break; }
            VER=$(basename "$apk" .apk); VER=${VER#Barq-v}; TAG="v$VER"
            if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already published"; continue; fi
            NOTES="docs/releases/$TAG.md"
            if [ ! -f "$NOTES" ]; then echo "## برق $VER" > /tmp/n.md; NOTES=/tmp/n.md; fi
            gh release create "$TAG" "$apk" --title "برق $VER" --notes-file "$NOTES" --target "$(cat "/tmp/old/sha-$VER")" --latest=false
            echo "Published $TAG"
          done
